[project]
name = "docsift"
version = "0.1.0.dev0"
description = "Convert documents once. Give agents only what they need."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anish Monci Varghese" }]
dependencies = [
  "typer>=0.12",
  "pydantic>=2.7",
]

[project.optional-dependencies]
markitdown = ["markitdown[docx,pptx,xlsx]>=0.1.1"]
docling = ["docling>=2.0"]
all = ["docsift[markitdown]", "docsift[docling]"]

[project.scripts]
docsift = "docsift.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "fpdf2>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docsift"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs real conversion engines (may download models)"]
addopts = "-m 'not integration'"
