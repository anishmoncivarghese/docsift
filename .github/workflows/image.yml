name: Build image

# Manual only. The image is several GB (both engines plus Docling's baked-in
# model weights), so building it on every push would be wasteful and slow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: "0.4.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The runner ships with toolchains this build never uses, and the image
      # is large enough that their disk footprint is worth reclaiming.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Log in to the registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" \
            | docker login "${{ secrets.ACR_LOGIN_SERVER }}" \
                -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build
        run: docker build -t "${{ secrets.ACR_LOGIN_SERVER }}/docsift:${{ inputs.tag }}" .

      # Runs before the push so a broken image never reaches the registry. The
      # test suite exercises the library and the API, but nothing exercised the
      # *image* -- which is how a container that could not convert a single PDF
      # got built and deployed. Converting a real PDF is the only check that
      # covers the engine's native dependencies.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/docsift:${{ inputs.tag }}"
          docker run -d --name smoke -p 8000:8000 "$IMAGE"
          trap 'docker logs smoke' EXIT

          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 2
          done
          curl -sf localhost:8000/health

          job=$(curl -sf -F "file=@tests/fixtures/multipage.pdf" \
                  localhost:8000/v1/documents \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["job_id"])')

          for _ in $(seq 1 60); do
            body=$(curl -sf "localhost:8000/v1/jobs/$job")
            status=$(printf '%s' "$body" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            case "$status" in
              succeeded) break ;;
              failed) echo "conversion failed: $body"; exit 1 ;;
            esac
            sleep 5
          done
          [ "$status" = succeeded ] || { echo "timed out in state: $status"; exit 1; }

          # A PDF that converts but yields nothing has not really converted.
          curl -sf "localhost:8000/v1/documents/$(printf '%s' "$body" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["document_id"])')/markdown" \
            | head -c 200

      - name: Push
        run: docker push "${{ secrets.ACR_LOGIN_SERVER }}/docsift:${{ inputs.tag }}"

      - name: Report image size
        run: docker images "${{ secrets.ACR_LOGIN_SERVER }}/docsift"
