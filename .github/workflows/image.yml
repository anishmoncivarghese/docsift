name: Build image

# Manual only. The image is several GB (both engines plus Docling's baked-in
# model weights), so building it on every push would be wasteful and slow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: true
        default: "0.4.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # The runner ships with toolchains this build never uses, and the image
      # is large enough that their disk footprint is worth reclaiming.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Log in to the registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" \
            | docker login "${{ secrets.ACR_LOGIN_SERVER }}" \
                -u "${{ secrets.ACR_USERNAME }}" --password-stdin

      - name: Build
        run: docker build -t "${{ secrets.ACR_LOGIN_SERVER }}/docsift:${{ inputs.tag }}" .

      - name: Push
        run: docker push "${{ secrets.ACR_LOGIN_SERVER }}/docsift:${{ inputs.tag }}"

      - name: Report image size
        run: docker images "${{ secrets.ACR_LOGIN_SERVER }}/docsift"
