name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra markitdown
      - run: uv run ruff check .
      - run: uv run pytest -v
      - name: Verify tag matches package version
        run: |
          version=$(uv run python -c "import docsift; print(docsift.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          [ "$version" = "$tag" ] || { echo "tag $tag != version $version"; exit 1; }
      - run: uv build
      - run: uv publish --trusted-publishing always
